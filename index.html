<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khalid / Qirim Yurtu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; overflow: hidden; font-family: monospace; color: white; }
    #countdown { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 6rem; z-index: 10;
    }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #mainContent { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      opacity: 0; color: #f0f0f0; font-size: 1.5rem;
      z-index: 5; text-align: center;
    }
  </style>
</head>
<body>
  <div id="countdown">5</div>
  <canvas id="canvas"></canvas>
  <div id="mainContent">
    <h1>Добро пожаловать! / Hoş geldiniz! / Welcome!</h1>
    <p>Я Khalid, также известен как Qirim Yurtu. Здесь вы найдёте информацию обо мне, моих навыках, проектах и контактах.</p>
  </div>

  <script>
    const countdownEl = document.getElementById('countdown');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let countdown = 5;
    const particles = [];
    const letters = '01@#%QWERTYASDZXCVkırımlı';
    const mainContent = document.getElementById('mainContent');
    let assembling = false;

    const sounds = {
      tick: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-game-click-1114.mp3'),
      boom: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-fast-small-explosion-1688.mp3'),
      type: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-typewriter-key-1123.mp3'),
      hum: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-space-ambience-1739.mp3')
    };

    function doCountdown() {
      if (countdown > 0) {
        countdownEl.textContent = countdown;
        sounds.tick.play();
        countdown--;
        setTimeout(doCountdown, 1000);
      } else {
        triggerExplosion();
      }
    }

    function triggerExplosion() {
      countdownEl.style.display = 'none';
      sounds.boom.play();
      sounds.hum.loop = true;
      sounds.hum.play();
      for (let i = 0; i < 400; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          dx: (Math.random() - 0.5) * 10,
          dy: (Math.random() - 0.5) * 10,
          char: letters[Math.floor(Math.random() * letters.length)],
          opacity: 1,
          assembled: false,
          targetX: Math.random() * canvas.width,
          targetY: Math.random() * canvas.height
        });
      }
      animateParticles();
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = '20px monospace';
      for (let p of particles) {
        if (!assembling) {
          p.x += p.dx;
          p.y += p.dy;
          p.opacity -= 0.01;
          if (p.opacity < 0.6) assembling = true;
        } else {
          p.x += (p.targetX - p.x) * 0.05;
          p.y += (p.targetY - p.y) * 0.05;
          if (Math.abs(p.x - p.targetX) < 2 && Math.abs(p.y - p.targetY) < 2) p.assembled = true;
        }
        ctx.fillStyle = `rgba(0,255,0,${p.opacity})`;
        ctx.fillText(p.char, p.x, p.y);
      }

      if (assembling && particles.every(p => p.assembled)) {
        setTimeout(() => {
          mainContent.style.opacity = 1;
          sounds.hum.pause();
        }, 1000);
      } else {
        requestAnimationFrame(animateParticles);
      }
    }

    doCountdown();
  </script>
</body>
</html>
