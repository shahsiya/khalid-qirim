<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Анимация частиц с текстом</title>
  <style>
    /* чтобы canvas занимал весь экран */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000; /* чёрный фон, можно менять */
      height: 100%;
      width: 100%;
    }
    canvas {
      display: block;
      position: fixed;
      top: 0; left: 0;
    }
  </style>
</head>
<body>
  <canvas></canvas>

  <script>
    // Вставь сюда весь JavaScript из моего предыдущего сообщения
    const canvas = document.querySelector("canvas");
    const ctx = canvas.getContext("2d");

    // Учитываем Retina дисплеи
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Настройки анимации и частиц
    const config = {
      particleSize: 20,
      maxFrame: 300,
      explodeRadius: 150,
      flyRadius: 70,
      baseSpeed: 2,
      text: "Окно",
      font: "20px Arial",
      shadowColor: "#00ff99",
      particleColor: "#00ff99",
    };

    // Фазы анимации
    const PHASES = {
      EXPLODE: "explode",
      FLY: "fly",
      DONE: "done",
    };

    // Easing функция (easeOutQuad)
    function easeOutQuad(t) {
      return t * (2 - t);
    }

    // Класс частицы
    class Particle {
      constructor(x, y, symbol) {
        this.homeX = x;
        this.homeY = y;
        this.symbol = symbol;

        this.x = x;
        this.y = y;

        this.vx = 0;
        this.vy = 0;

        this.radius = 0; // расстояние от центра (для фазы explode/ fly)

        this.angle = Math.random() * 2 * Math.PI; // случайный угол движения на радиусе

        this.phase = PHASES.EXPLODE;
        this.frame = 0;
      }

      update(frameCount) {
        const progress = frameCount / config.maxFrame;
        switch (this.phase) {
          case PHASES.EXPLODE:
            // частица движется из центра к radius = explodeRadius
            const easedProgress = easeOutQuad(progress);
            this.radius = easedProgress * config.explodeRadius;
            this.x = this.homeX + Math.cos(this.angle) * this.radius;
            this.y = this.homeY + Math.sin(this.angle) * this.radius;

            if (frameCount >= config.maxFrame) {
              this.phase = PHASES.FLY;
              this.frame = 0;
              // При переходе в fly задаём начальную скорость для "прыжков"
              this.vx = (Math.random() - 0.5) * config.baseSpeed;
              this.vy = (Math.random() - 0.5) * config.baseSpeed;
              this.radius = config.flyRadius;
            }
            break;

          case PHASES.FLY:
            // Частицы двигаются случайно вокруг home с radius flyRadius, периодически приближаясь к home
            this.x += this.vx;
            this.y += this.vy;

            // Ограничиваем радиус от home
            const dx = this.x - this.homeX;
            const dy = this.y - this.homeY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > config.flyRadius) {
              // отражаем скорость, чтобы частица оставалась в пределах радиуса
              this.vx = -this.vx;
              this.vy = -this.vy;
            }

            this.frame++;
            if (this.frame > config.maxFrame / 2) {
              // Начинаем собирать частицы обратно к home
              this.phase = PHASES.DONE;
              this.frame = 0;
            }
            break;

          case PHASES.DONE:
            // Частица плавно возвращается к homeX, homeY
            const ease = easeOutQuad(this.frame / (config.maxFrame / 2));
            this.x = this.x + (this.homeX - this.x) * ease;
            this.y = this.y + (this.homeY - this.y) * ease;
            this.frame++;

            if (this.frame >= config.maxFrame / 2) {
              // Анимация завершена, можно заморозить частицы или перезапускать
              this.x = this.homeX;
              this.y = this.homeY;
            }
            break;
        }
      }

      draw(ctx) {
        ctx.font = `${config.particleSize}px Arial`;
        ctx.fillStyle = config.particleColor;
        ctx.shadowColor = config.shadowColor;
        ctx.shadowBlur = 5;
        ctx.fillText(this.symbol, this.x, this.y);
      }
    }

    // Создаём массив частиц на основе текста
    function createParticles(text) {
      ctx.font = config.font;
      const particles = [];

      // Чтобы получить позицию символов, будем рассчитывать ширину каждого символа и сдвигать
      let offsetX = 50; // стартовая позиция по X
      const offsetY = canvas.height / 2; // вертикальный центр

      for (const char of text) {
        const width = ctx.measureText(char).width;

        // позиция частицы - центр символа по X и Y (примерно)
        const x = offsetX + width / 2;
        const y = offsetY;

        particles.push(new Particle(x, y, char));

        offsetX += width;
      }

      return particles;
    }

    let particles = createParticles(config.text);

    let frameCount = 0;

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const p of particles) {
        p.update(frameCount);
        p.draw(ctx);
      }

      frameCount++;

      // Можно циклично повторять анимацию:
      if (frameCount > config.maxFrame * 2) {
        frameCount = 0;
        particles = createParticles(config.text);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
