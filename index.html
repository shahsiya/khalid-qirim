<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Анимация частиц с полётом по экрану</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }
  html, body {
    height: 100%; background: #fff; overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #222;
    user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #fff;
    z-index: 1;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  const lines = [
    "Добро пожаловать! / Hoş geldiniz! / Welcome!",
    "Я Khalid, также известен как Qirim Yurtu.",
    "Frontend-разработка, Firebase, WordPress, Tilda.",
    "Node.js, парсинг, автоматизация.",
    "Контакты: @shahsiya123 | master_work@outlook.com"
  ];

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  }
  resize();
  window.addEventListener('resize', resize);

  const particleSize = 20;
  const particles = [];
  let animationPhase = 'explode'; // explode -> fly -> assemble -> done
  let frame = 0;

  const centerX = W / 2;
  const centerY = H / 2;

  const assembledPositions = [];
  function prepareAssembledPositions() {
    const totalHeight = lines.length * particleSize * 1.7;
    const startY = centerY - totalHeight / 2;
    for(let i=0; i<lines.length; i++) {
      const line = lines[i];
      const lineLength = line.length;
      const startX = centerX - (lineLength * particleSize)/2;
      for(let j=0; j<lineLength; j++) {
        assembledPositions.push({
          x: startX + j*particleSize,
          y: startY + i*particleSize*1.7,
          char: line[j]
        });
      }
    }
  }
  prepareAssembledPositions();

  function createParticles() {
    particles.length = 0;
    for(let i=0; i<assembledPositions.length; i++) {
      const pos = assembledPositions[i];
      // Стартовая позиция - центр
      // Начальная скорость для взрыва
      const angle = Math.random() * Math.PI * 2;
      const speed = 4 + Math.random()*3;
      particles.push({
        x: centerX,
        y: centerY,
        char: pos.char,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        targetX: pos.x,
        targetY: pos.y,
        phase: 'explode'
      });
    }
  }
  createParticles();

  function lerp(a, b, t) {
    return a + (b - a)*t;
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);

    ctx.font = `${particleSize}px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';

    frame++;

    let allAssembled = true;

    for(let p of particles) {
      if(p.phase === 'explode') {
        // Взрыв — частицы улетают из центра
        p.x += p.vx;
        p.y += p.vy;
        // Немного трения
        p.vx *= 0.95;
        p.vy *= 0.95;

        // Когда скорость станет маленькой — переход к полёту
        if(Math.abs(p.vx) < 0.5 && Math.abs(p.vy) < 0.5) {
          p.phase = 'fly';
          // Задаём новую случайную скорость для свободного полёта
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random()*2;
          p.vx = Math.cos(angle)*speed;
          p.vy = Math.sin(angle)*speed;
        }
      } else if(p.phase === 'fly') {
        // Свободный полёт по экрану
        p.x += p.vx;
        p.y += p.vy;

        // Отражение от краёв
        if(p.x < 0 || p.x > W) p.vx = -p.vx;
        if(p.y < 0 || p.y > H) p.vy = -p.vy;

        // Плавное изменение направления (случайный поворот)
        if(Math.random() < 0.02) {
          const angle = Math.atan2(p.vy, p.vx) + (Math.random()-0.5);
          const speed = Math.hypot(p.vx, p.vy);
          p.vx = Math.cos(angle)*speed;
          p.vy = Math.sin(angle)*speed;
        }

        // Через 6 секунд (примерно 360 кадров) начинаем сборку
        if(frame > 360) {
          p.phase = 'assemble';
        }
      } else if(p.phase === 'assemble') {
        // Сборка — плавно движемся к целевой точке
        p.x = lerp(p.x, p.targetX, 0.12);
        p.y = lerp(p.y, p.targetY, 0.12);

        if(Math.abs(p.x - p.targetX) > 1 || Math.abs(p.y - p.targetY) > 1) {
          allAssembled = false;
        }
      }

      // Тень и стиль текста
      ctx.shadowColor = 'rgba(0,0,0,0.15)';
      ctx.shadowBlur = 3;
      ctx.fillStyle = '#222';

      ctx.fillText(p.char, p.x, p.y);
      ctx.shadowBlur = 0;
    }

    if(animationPhase === 'explode' && frame > 60) {
      animationPhase = 'fly';
      frame = 0;
    } else if(animationPhase === 'fly' && frame > 360) {
      animationPhase = 'assemble';
      frame = 0;
    } else if(animationPhase === 'assemble' && allAssembled) {
      animationPhase = 'done';
    }

    if(animationPhase !== 'done') {
      requestAnimationFrame(animate);
    } else {
      // Финальный статичный текст
      ctx.clearRect(0, 0, W, H);
      ctx.shadowColor = 'rgba(0,0,0,0.2)';
      ctx.shadowBlur = 4;
      ctx.fillStyle = '#111';
      for(let p of particles) {
        ctx.fillText(p.char, p.x, p.y);
      }
      ctx.shadowBlur = 0;
    }
  }

  animate();

</script>
</body>
</html>
