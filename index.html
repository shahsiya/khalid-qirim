<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qirim Yurtu</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    a {
      position: absolute;
      z-index: 10;
      color: transparent;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- Ссылки -->
<a id="telegram" href="https://t.me/yourusername" target="_blank" style="left:-100px;top:-100px;">tg</a>
<a id="email" href="mailto:your@email.com" target="_blank" style="left:-100px;top:-100px;">mail</a>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let w = (canvas.width = window.innerWidth);
let h = (canvas.height = window.innerHeight);
window.addEventListener("resize", () => {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  start();
});

const textLines = [
  "Привет, я Qirim Yurtu!",
  "Frontend, Firebase, Node.js",
];

const iconData = {
  telegram: [
    [2,4],[3,3],[4,2],[5,2],[6,3],[7,4],[8,5],[8,6],[7,7],[6,7],[5,6],[4,5],[3,6],[2,7],[1,7],[1,6]
  ],
  mail: [
    [1,2],[2,1],[3,1],[4,2],[4,3],[4,4],[3,5],[2,5],[1,4],[1,3]
  ]
};

const particles = [];
let positions = [];

function getTextPoints(lines, fontSize = 18) {
  const offscreen = document.createElement("canvas");
  const ctx2 = offscreen.getContext("2d");
  offscreen.width = w;
  offscreen.height = h;
  ctx2.fillStyle = "#000";
  ctx2.font = `${fontSize}px sans-serif`;
  ctx2.textAlign = "center";
  ctx2.textBaseline = "middle";

  const points = [];
  const gap = 6;
  lines.forEach((line, i) => {
    ctx2.clearRect(0, 0, w, h);
    ctx2.fillText(line, w / 2, h / 2 + (i - lines.length / 2) * 40);
    const imageData = ctx2.getImageData(0, 0, w, h).data;
    for (let y = 0; y < h; y += gap) {
      for (let x = 0; x < w; x += gap) {
        const index = (y * w + x) * 4;
        if (imageData[index + 3] > 128) {
          points.push({ x, y });
        }
      }
    }
  });
  return points;
}

function getIconPoints(icon, centerX, centerY, scale = 6) {
  return icon.map(([x, y]) => ({
    x: centerX + x * scale,
    y: centerY + y * scale,
  }));
}

function createParticlesFromPositions(posList) {
  particles.length = 0;
  posList.forEach((p) => {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 2;
    particles.push({
      x: w / 2,
      y: h / 2,
      targetX: p.x,
      targetY: p.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      phase: "explode",
      angle: Math.random() * Math.PI * 2,
      radius: Math.random() * 100 + 50,
    });
  });
}

function update() {
  ctx.clearRect(0, 0, w, h);
  let allDone = true;

  particles.forEach((p) => {
    if (p.phase === "explode") {
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.9;
      p.vy *= 0.9;
      if (Math.abs(p.vx) < 0.5 && Math.abs(p.vy) < 0.5) {
        p.phase = "orbit";
      }
    } else if (p.phase === "orbit") {
      p.angle += 0.02;
      p.radius *= 0.97;
      p.x = p.targetX + Math.cos(p.angle) * p.radius;
      p.y = p.targetY + Math.sin(p.angle) * p.radius;
      if (p.radius < 1) {
        p.phase = "assemble";
      }
    } else if (p.phase === "assemble") {
      p.x += (p.targetX - p.x) * 0.1;
      p.y += (p.targetY - p.y) * 0.1;
      if (Math.abs(p.x - p.targetX) > 0.5 || Math.abs(p.y - p.targetY) > 0.5) {
        allDone = false;
      }
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
    ctx.fillStyle = "#000";
    ctx.fill();
  });

  if (!allDone) requestAnimationFrame(update);
}

function start() {
  const textPoints = getTextPoints(textLines);
  const telegramIcon = getIconPoints(iconData.telegram, w / 2 - 100, h / 2 + 100);
  const mailIcon = getIconPoints(iconData.mail, w / 2 + 100, h / 2 + 100);

  // Центры для ссылок
  const tg = document.getElementById("telegram");
  tg.style.left = w / 2 - 100 + "px";
  tg.style.top = h / 2 + 100 + "px";
  const mail = document.getElementById("email");
  mail.style.left = w / 2 + 100 + "px";
  mail.style.top = h / 2 + 100 + "px";

  positions = [...textPoints, ...telegramIcon, ...mailIcon];
  createParticlesFromPositions(positions);
  update();
}

start();
</script>
</body>
</html>
