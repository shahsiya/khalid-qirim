<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Анимация частиц</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: white;
      font-family: 'Segoe UI', sans-serif;
    }
    canvas {
      display: block;
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;
canvas.width = W;
canvas.height = H;

const lines = [
  "Привет, я Khalid 👋",
  "Также известен как Qirim Yurtu.",
  "Frontend, Firebase, Node.js.",
  "Парсинг, автоматизация, WordPress."
];

let particles = [];
const particleSize = 20;

function createParticles() {
  particles = [];
  ctx.font = `${particleSize}px 'Segoe UI'`;
  ctx.textBaseline = 'top';

  const totalHeight = lines.length * particleSize * 1.8;
  const startY = H / 2 - totalHeight / 2;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const lineWidth = ctx.measureText(line).width;
    const startX = W / 2 - lineWidth / 2;

    for (let j = 0; j < line.length; j++) {
      const char = line[j];
      const x = startX + ctx.measureText(line.slice(0, j)).width;
      const y = startY + i * particleSize * 1.8;

      const angle = Math.random() * 2 * Math.PI;
      const radius = 100 + Math.random() * 150;

      particles.push({
        char,
        x: W / 2,
        y: H / 2,
        tx: x,
        ty: y,
        angle,
        radius,
        opacity: 0,
        arrived: false
      });
    }
  }
}

function animate() {
  ctx.clearRect(0, 0, W, H);
  ctx.font = `${particleSize}px 'Segoe UI'`;
  ctx.textBaseline = 'top';

  let allArrived = true;

  for (let p of particles) {
    if (!p.arrived) {
      // Explosion phase (move outward)
      const dx = p.tx - p.x;
      const dy = p.ty - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 1) {
        p.arrived = true;
        p.x = p.tx;
        p.y = p.ty;
        p.opacity = 1;
      } else {
        p.x += dx * 0.07;
        p.y += dy * 0.07;
        p.opacity += 0.05;
        allArrived = false;
      }
    }

    ctx.globalAlpha = Math.min(p.opacity, 1);
    ctx.fillStyle = "#111";
    ctx.fillText(p.char, p.x, p.y);
  }

  ctx.globalAlpha = 1;

  if (!allArrived) {
    requestAnimationFrame(animate);
  }
}

window.addEventListener("resize", () => {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  createParticles();
  animate();
});

createParticles();
animate();
</script>

</body>
</html>
