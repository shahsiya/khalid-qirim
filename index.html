<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qirim Yurtu</title>
  <!-- Подключаем Orbitron -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet" />
  <style>
   /* Обнуляем стили и устанавливаем box-sizing */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow-x: hidden;
  font-family: 'Orbitron', sans-serif;
  background-color: #ffffff;
  color: #050505;
}

/* Контейнер для анимации - занимает весь экран */
#animation-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* canvas внутри контейнера занимает весь контейнер */
#animation-container canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Блок иконок */
#icons {
  position: absolute;
  bottom: 60px;
  left: 0;
  width: 100%;
  max-width: 100vw;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  padding: 10px 16px;
  opacity: 0;
  transition: opacity 1s ease;
  z-index: 10;
  box-sizing: border-box;
}

/* Появление иконок после завершения анимации */
#icons.visible {
  opacity: 1;
}

/* Иконки */
#icons img {
  width: 40px;
  height: 40px;
  object-fit: contain;
  transition: transform 0.3s ease;
  flex-shrink: 0;
}

#icons img:hover {
  transform: scale(1.1);
}

/* Медиазапросы */
@media (max-width: 768px) {
  #icons img {
    width: 36px;
    height: 32px;
  }
}

@media (max-width: 480px) {
  #icons img {
    width: 32px;
    height: 32px;
  }

  #icons {
    gap: 12px;
  }
}

  </style>
</head>
<body>
  <div id="animation-container">
    <canvas id="canvas"></canvas>

    <div id="icons">
      <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub" />
      <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="HTML5" />
      <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn" />
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let W, H;
    let particleSize;
    let dpr = window.devicePixelRatio || 1;

    const lines = [
      "Добро пожаловать! ",
      "Меня зовут Халид.",
      "Я занимаюсь",
      "Frontend-разработкой",
       "Firebase,WordPress",
      "Tilda,Node.js", 
      "парсинг,автоматизация."
    ];

    let particles = [];
    let frame = 0;
    let animationPhase = 'explode';
    let assembledPositions = [];

    function centerX() { return W / 2; }
    function centerY() { return H / 2; }

   function getMaxFittingParticleSize() {
  const longestLine = lines.reduce((a, b) => (a.length > b.length ? a : b));
  const padding = 40;
  const availableWidth = W - padding;

  // Устанавливаем начальный размер шрифта в зависимости от ширины экрана
  let size;
  if (W < 480) {
    size = 17; // для телефонов
  } else if (W < 768) {
    size = 25; // для планшетов
  } else {
    size = 32; // для десктопа
  }

  ctx.font = `bold ${size}px 'Orbitron', sans-serif`;
  let textWidth = ctx.measureText(longestLine).width;

  // Подгоняем размер под доступную ширину
  while (textWidth > availableWidth && size > 10) {
    size -= 1;
    ctx.font = `bold ${size}px 'Orbitron', sans-serif`;
    textWidth = ctx.measureText(longestLine).width;
  }

  return size;
}

    function setupCanvas() {
      W = window.innerWidth;
      H = window.innerHeight;

      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      ctx.imageSmoothingEnabled = false;

      particleSize = getMaxFittingParticleSize();

      prepareAssembledPositions();
      createParticles();
    }

    window.addEventListener('resize', setupCanvas);

    function prepareAssembledPositions() {
      assembledPositions.length = 0;
      const totalHeight = lines.length * particleSize * 1.8;
      const startY = centerY() - totalHeight / 2;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const lineLength = line.length;
        const startX = centerX() - (lineLength * particleSize) / 2;
        for (let j = 0; j < lineLength; j++) {
          assembledPositions.push({
            x: startX + j * particleSize,
            y: startY + i * particleSize * 1.8,
            char: line[j]
          });
        }
      }
    }

    function createParticles() {
      particles.length = 0;
      for (let i = 0; i < assembledPositions.length; i++) {
        const pos = assembledPositions[i];
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 2;
        particles.push({
          x: centerX(),
          y: centerY(),
          char: pos.char,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          targetX: pos.x,
          targetY: pos.y,
          phase: 'explode',
          flyRadius: 100 + Math.random() * 100,
          flyAngle: Math.random() * Math.PI * 2,
          flySpeed: 0.01 + Math.random() * 0.015,
          opacity: 0
        });
      }
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

   function drawTextWithEffects(p, x, y) {
  // Светящееся золотое свечение
  ctx.shadowColor = 'rgba(255, 215, 0, 0.8)';
  ctx.shadowBlur = 12;
  
  // Золотая обводка
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#FFD700';
  ctx.strokeText(p.char, x, y);

  // Чёрное заполнение
  ctx.fillStyle = '#000000';
  ctx.fillText(p.char, x, y);
}

    function animate() {
      ctx.clearRect(0, 0, W, H);
      ctx.font = `bold ${particleSize}px 'Orbitron', sans-serif`;
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';

      frame++;

      let allAssembled = true;

      for (let p of particles) {
        if (p.phase === 'explode') {
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.93;
          p.vy *= 0.93;
          p.opacity = Math.min(1, p.opacity + 0.03);
          if (Math.abs(p.vx) < 0.5 && Math.abs(p.vy) < 0.5) {
            p.phase = 'fly';
          }
        }

        if (p.phase === 'fly') {
          if (frame > 200) {
            p.flyRadius = lerp(p.flyRadius, 0, 0.04);
            if (p.flyRadius < 1) {
              p.x = lerp(p.x, p.targetX, 0.12);
              p.y = lerp(p.y, p.targetY, 0.12);
            } else {
              p.flyAngle += p.flySpeed;
              p.x = lerp(p.x, p.targetX + p.flyRadius * Math.cos(p.flyAngle), 0.08);
              p.y = lerp(p.y, p.targetY + p.flyRadius * Math.sin(p.flyAngle), 0.08);
            }
          } else {
            p.flyAngle += p.flySpeed;
            p.x += Math.cos(p.flyAngle) * 1.2;
            p.y += Math.sin(p.flyAngle) * 1.2;
          }

          if (Math.abs(p.x - p.targetX) > 1.5 || Math.abs(p.y - p.targetY) > 1.5 || p.flyRadius > 1) {
            allAssembled = false;
          }
        }

        ctx.globalAlpha = p.opacity;
        drawTextWithEffects(p, p.x, p.y);
      }

      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;

      if (animationPhase !== 'done') {
        if (allAssembled && frame > 200) {
          animationPhase = 'done';
          document.getElementById('icons').classList.add('visible');
        } else {
          requestAnimationFrame(animate);
        }
      }
    }

    setupCanvas();
    animate();
  </script>
</body>
</html>
