<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Плавная анимация частиц</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }
  html, body {
    height: 100%; background: #fff; overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #222;
    user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #fff;
    z-index: 1;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  const lines = [
    "Добро пожаловать! / Hoş geldiniz! / Welcome!",
    "Я Khalid, также известен как Qirim Yurtu.",
    "Frontend-разработка, Firebase, WordPress, Tilda.",
    "Node.js, парсинг, автоматизация.",
    "Контакты: @shahsiya123 | master_work@outlook.com"
  ];

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  }
  resize();
  window.addEventListener('resize', resize);

  const particleSize = 20;
  const particles = [];
  let frame = 0;

  const centerX = W / 2;
  const centerY = H / 2;

  const assembledPositions = [];
  function prepareAssembledPositions() {
    const totalHeight = lines.length * particleSize * 1.7;
    const startY = centerY - totalHeight / 2;
    for(let i=0; i<lines.length; i++) {
      const line = lines[i];
      const lineLength = line.length;
      const startX = centerX - (lineLength * particleSize)/2;
      for(let j=0; j<lineLength; j++) {
        assembledPositions.push({
          x: startX + j*particleSize,
          y: startY + i*particleSize*1.7,
          char: line[j]
        });
      }
    }
  }
  prepareAssembledPositions();

  function createParticles() {
    particles.length = 0;
    for(let i=0; i<assembledPositions.length; i++) {
      const pos = assembledPositions[i];
      const angle = Math.random() * Math.PI * 2;
      const speed = 4 + Math.random()*3;
      particles.push({
        x: centerX,
        y: centerY,
        char: pos.char,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        baseVx: 0,
        baseVy: 0,
        targetX: pos.x,
        targetY: pos.y,
        phase: 'explode',
        // для плавного уменьшения разброса летания
        flyRadius: 100 + Math.random()*100,
        flyAngle: Math.random()*Math.PI*2
      });
    }
  }
  createParticles();

  function lerp(a, b, t) {
    return a + (b - a)*t;
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);

    ctx.font = `${particleSize}px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';

    frame++;

    let allAssembled = true;

    for(let p of particles) {
      if(p.phase === 'explode') {
        // Взрыв — частицы улетают из центра
        p.x += p.vx;
        p.y += p.vy;
        // Трение
        p.vx *= 0.95;
        p.vy *= 0.95;
        if(Math.abs(p.vx) < 0.5 && Math.abs(p.vy) < 0.5) {
          p.phase = 'fly';
          // Начинаем свободный полёт с радиусом и углом
          p.flyRadius = 150 + Math.random()*150;
          p.flyAngle = Math.random()*Math.PI*2;
          p.flySpeed = 0.015 + Math.random()*0.015;
        }
      } 
      
      if(p.phase === 'fly') {
        // Увеличиваем счётчик для контроля времени полёта и начала сборки
        if(frame > 300) {
          // Постепенно уменьшаем радиус полёта, приближая частицы к цели
          p.flyRadius = lerp(p.flyRadius, 0, 0.02);
          // Если радиус меньше очень маленького значения, считаем, что частица достигла центра сборки
          if(p.flyRadius < 1) {
            // Плавно двигаемся к цели, чтобы идеально сесть
            p.x = lerp(p.x, p.targetX, 0.1);
            p.y = lerp(p.y, p.targetY, 0.1);
          } else {
            // Частица летает по кругу вокруг точки сборки с уменьшающимся радиусом
            p.flyAngle += p.flySpeed;
            p.x = lerp(p.x, p.targetX + p.flyRadius * Math.cos(p.flyAngle), 0.1);
            p.y = lerp(p.y, p.targetY + p.flyRadius * Math.sin(p.flyAngle), 0.1);
          }
        } else {
          // Полёт по кругу с постоянным радиусом (свободный полёт)
          p.flyAngle += p.flySpeed;
          p.x += Math.cos(p.flyAngle) * 1.5;
          p.y += Math.sin(p.flyAngle) * 1.5;
        }

        // Проверяем, насколько близко частица к цели
        if(Math.abs(p.x - p.targetX) > 2 || Math.abs(p.y - p.targetY) > 2 || p.flyRadius > 1) {
          allAssembled = false;
        }
      }

      // Стиль текста с тенью
      ctx.shadowColor = 'rgba(0,0,0,0.15)';
      ctx.shadowBlur = 3;
      ctx.fillStyle = '#222';
      ctx.fillText(p.char, p.x, p.y);
      ctx.shadowBlur = 0;
    }

    if(animationPhase !== 'done') {
      if(allAssembled && frame > 300) {
        animationPhase = 'done';
      } else {
        requestAnimationFrame(animate);
      }
    } else {
      // Финальный статичный текст
      ctx.clearRect(0, 0, W, H);
      ctx.shadowColor = 'rgba(0,0,0,0.2)';
      ctx.shadowBlur = 4;
      ctx.fillStyle = '#111';
      for(let p of particles) {
        ctx.fillText(p.char, p.x, p.y);
      }
      ctx.shadowBlur = 0;
    }
  }

  let animationPhase = 'explode';
  animate();
</script>

</body>
</html>
