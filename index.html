<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khalid / Qirim Yurtu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; overflow: hidden; font-family: monospace; color: white; }
    #countdown { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 6rem; z-index: 10;
    }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #mainContent { 
      opacity: 0; position: relative; z-index: 5; padding: 2rem;
      background: #f9f9f9; color: #111; height: 100vh; overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="countdown">5</div>
  <canvas id="canvas"></canvas>
  <div id="mainContent">
    <h1>Добро пожаловать! / Hoş geldiniz! / Welcome!</h1>
    <p>Я Khalid, также известен как Qirim Yurtu. Здесь вы найдёте информацию обо мне, моих навыках, проектах и контактах.</p>
  </div>

  <script>
    const countdownEl = document.getElementById('countdown');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let countdown = 5;

    const sounds = {
      tick: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-game-click-1114.mp3'),
      boom: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-fast-small-explosion-1688.mp3'),
      type: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-typewriter-key-1123.mp3'),
      hum: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-space-ambience-1739.mp3')
    };

    function doCountdown() {
      if (countdown > 0) {
        countdownEl.textContent = countdown;
        sounds.tick.play();
        countdown--;
        setTimeout(doCountdown, 1000);
      } else {
        triggerExplosion();
      }
    }

    function triggerExplosion() {
      countdownEl.style.display = 'none';
      sounds.boom.play();
      startParticles();
    }

    let particles = [];
    const letters = '01@#%QWERTYASDZXCVkırımlı';

    function startParticles() {
      sounds.hum.loop = true;
      sounds.hum.play();
      for (let i = 0; i < 300; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          dx: (Math.random() - 0.5) * 5,
          dy: (Math.random() - 0.5) * 5,
          char: letters[Math.floor(Math.random() * letters.length)]
        });
      }
      animateParticles();
      setTimeout(showMainContent, 5000);
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0f0';
      ctx.font = '20px monospace';
      for (let p of particles) {
        ctx.fillText(p.char, p.x, p.y);
        p.x += p.dx;
        p.y += p.dy;
      }
      sounds.type.play();
      requestAnimationFrame(animateParticles);
    }

    function showMainContent() {
      document.getElementById('mainContent').style.opacity = 1;
      canvas.style.display = 'none';
      sounds.hum.pause();
    }

    doCountdown();
  </script>
</body>
</html>
