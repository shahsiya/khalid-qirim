<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Анимация частиц</title>
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
    html, body {
      width: 100%;
      height: 100%;
      background-color: #fff;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #111;
    }
    canvas {
      display: block;
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }
    #icons {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 40px;
      z-index: 10;
    }
    #icons a {
      text-decoration: none;
      color: #222;
      width: 48px;
      height: 48px;
      display: inline-block;
      transition: transform 0.3s ease, filter 0.3s ease;
    }
    #icons a:hover {
      transform: scale(1.2);
      filter: brightness(0.6);
    }
    svg {
      width: 100%;
      height: 100%;
      fill: #111;
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="icons">
  <a href="https://t.me/shahsiya123" target="_blank" aria-label="Telegram">
    <svg viewBox="0 0 240 240">
      <circle cx="120" cy="120" r="120" fill="#fff"/>
      <path d="M97.7 164.6c-3.6 0-4.7-1.6-6.6-5.6l-18.4-37.6-37.4-12.1c-7.9-2.6-8-7.9 1.6-11.7l71.2-27.5c6.7-2.6 12.7 1.5 10.3 11l-15 67.2c-1.4 6.1-3.3 7.8-5.7 7.8z" fill="#0088cc"/>
      <path d="M122.2 122.5l48.8-41.4c4.6-3.6 8.8-1.7 5.7 5.7l-38.1 59.7c-3.6 5.6-6.6 7.9-13.7 4.7l-18.3-13.7z" fill="#00b2ff"/>
    </svg>
  </a>
  <a href="mailto:master_work@outlook.com" aria-label="Email">
    <svg viewBox="0 0 24 24">
      <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
    </svg>
  </a>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let W = window.innerWidth;
let H = window.innerHeight;
canvas.width = W;
canvas.height = H;

const lines = [
  "Привет, я Khalid 👋",
  "Также известен как Qirim Yurtu.",
  "Frontend, Firebase, Node.js.",
  "Парсинг, автоматизация, WordPress."
];

let particles = [];
const particleSize = 20;
const centerX = () => window.innerWidth / 2;
const centerY = () => window.innerHeight / 2;

function createParticles() {
  particles = [];
  ctx.font = `${particleSize}px 'Segoe UI', sans-serif`;
  ctx.textBaseline = 'top';

  const totalHeight = lines.length * particleSize * 1.8;
  const startY = centerY() - totalHeight / 2;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const lineWidth = ctx.measureText(line).width;
    const startX = centerX() - lineWidth / 2;

    for (let j = 0; j < line.length; j++) {
      const char = line[j];
      const x = startX + ctx.measureText(line.slice(0, j)).width;
      const y = startY + i * particleSize * 1.8;

      const angle = Math.random() * 2 * Math.PI;
      const radius = 100 + Math.random() * 200;

      particles.push({
        char,
        x: centerX(),
        y: centerY(),
        tx: x,
        ty: y,
        opacity: 0,
        angle,
        radius,
        speed: 0.02 + Math.random() * 0.02,
        phase: 'explode'
      });
    }
  }
}

function animate() {
  ctx.clearRect(0, 0, W, H);
  ctx.font = `${particleSize}px 'Segoe UI', sans-serif`;
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';

  let allArrived = true;

  for (let p of particles) {
    if (p.phase === 'explode') {
      p.x += Math.cos(p.angle) * 4;
      p.y += Math.sin(p.angle) * 4;
      if (Math.abs(p.x - p.tx) < 4 && Math.abs(p.y - p.ty) < 4) {
        p.phase = 'arrive';
      } else {
        allArrived = false;
      }
    } else {
      p.x += (p.tx - p.x) * 0.1;
      p.y += (p.ty - p.y) * 0.1;
      p.opacity += 0.05;
    }

    ctx.globalAlpha = Math.min(p.opacity, 1);
    ctx.fillStyle = "#111";
    ctx.fillText(p.char, p.x, p.y);
  }

  ctx.globalAlpha = 1.0;

  if (!allArrived) {
    requestAnimationFrame(animate);
  }
}

window.addEventListener("resize", () => {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  createParticles();
  animate();
});

createParticles();
animate();
</script>

</body>
</html>
