<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Khalid / Qirim Yurtu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: monospace;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const letters = "01@#%QWERTYASDZXCVBNMkırımlı";
  const content = [
    'Добро пожаловать! / Hoş geldiniz! / Welcome!',
    'Я Khalid, также известен как Qirim Yurtu.',
    'Frontend-разработка, Firebase, WordPress, Tilda.',
    'Node.js, парсинг, автоматизация.',
    'Контакты: @shahsiya123 | master_work@outlook.com'
  ];

  const particles = [];
  const totalLetters = content.reduce((acc, line) => acc + line.length, 0);
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;

  let assembling = false;
  let assigned = 0;

  function createParticles() {
    for (let i = 0; i < totalLetters * 3; i++) {
      particles.push({
        x: centerX,
        y: centerY,
        dx: (Math.random() - 0.5) * 10,
        dy: (Math.random() - 0.5) * 10,
        char: letters[Math.floor(Math.random() * letters.length)],
        targetX: null,
        targetY: null,
        targetChar: null,
        assembling: false,
        arrived: false
      });
    }
  }

  function assignTargets() {
    let index = 0;
    const startY = centerY - content.length * 15;

    for (let i = 0; i < content.length; i++) {
      const line = content[i];
      const startX = centerX - line.length * 7;

      for (let j = 0; j < line.length; j++) {
        const char = line[j];
        if (index >= particles.length) break;

        const p = particles[index];
        p.targetX = startX + j * 14;
        p.targetY = startY + i * 30;
        p.targetChar = char;
        p.assembling = true;
        index++;
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = "20px monospace";

    for (let p of particles) {
      if (!p.assembling) {
        p.x += p.dx;
        p.y += p.dy;
        p.dx *= 0.98;
        p.dy *= 0.98;
      } else if (!p.arrived) {
        p.x += (p.targetX - p.x) * 0.1;
        p.y += (p.targetY - p.y) * 0.1;

        if (Math.abs(p.x - p.targetX) < 1 && Math.abs(p.y - p.targetY) < 1) {
          p.arrived = true;
          p.char = p.targetChar;
          assigned++;
        }
      }

      ctx.fillStyle = `rgba(0,255,100,0.9)`;
      ctx.fillText(p.char, p.x, p.y);
    }

    requestAnimationFrame(animate);
  }

  // Запуск
  createParticles();
  setTimeout(() => {
    assembling = true;
    assignTargets();
  }, 2000); // Взрыв 2 сек

  animate();
</script>
</body>
</html>
