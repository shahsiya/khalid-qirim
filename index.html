<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Анимация сборки из частиц</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }
  html, body {
    height: 100%; background: #000; overflow: hidden;
    font-family: monospace;
    color: #0f0;
    user-select: none;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: black;
    z-index: 1;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  const lines = [
    "Добро пожаловать! / Hoş geldiniz! / Welcome!",
    "Я Khalid, также известен как Qirim Yurtu.",
    "Frontend-разработка, Firebase, WordPress, Tilda.",
    "Node.js, парсинг, автоматизация.",
    "Контакты: @shahsiya123 | master_work@outlook.com"
  ];

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  }
  resize();
  window.addEventListener('resize', resize);

  const particleSize = 18;
  const particles = [];
  let animationPhase = 'explode'; // explode -> orbit -> assemble -> done
  let frame = 0;
  const centerX = W / 2;
  const centerY = H / 2;

  const assembledPositions = [];
  function prepareAssembledPositions() {
    const totalHeight = lines.length * particleSize * 1.5;
    const startY = centerY - totalHeight / 2;
    for(let i=0; i<lines.length; i++) {
      const line = lines[i];
      const lineLength = line.length;
      const startX = centerX - (lineLength * particleSize)/2;
      for(let j=0; j<lineLength; j++) {
        assembledPositions.push({
          x: startX + j*particleSize,
          y: startY + i*particleSize*1.5,
          char: line[j]
        });
      }
    }
  }
  prepareAssembledPositions();

  function createParticles() {
    particles.length = 0;
    for(let i=0; i<assembledPositions.length; i++) {
      const pos = assembledPositions[i];
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.02 + Math.random()*0.03;
      const orbitRadius = 50 + Math.random()*150;
      particles.push({
        x: centerX,
        y: centerY,
        char: pos.char,
        angle: angle,
        speed: speed,
        orbitRadius: orbitRadius,
        targetX: pos.x,
        targetY: pos.y,
        phase: 'explode',
        vx: (Math.random()-0.5)*15,
        vy: (Math.random()-0.5)*15,
        opacity: 1
      });
    }
  }
  createParticles();

  function lerp(a, b, t) {
    return a + (b - a)*t;
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0f0';
    ctx.font = `${particleSize}px monospace`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';

    frame++;

    let allAssembled = true;

    for(let p of particles) {
      if(p.phase === 'explode') {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;

        if(Math.abs(p.vx) < 0.5 && Math.abs(p.vy) < 0.5) {
          p.phase = 'orbit';
          p.angle = Math.atan2(p.y - centerY, p.x - centerX);
          p.orbitRadius = Math.hypot(p.x - centerX, p.y - centerY);
        }
      } else if(p.phase === 'orbit') {
        p.angle += p.speed;
        p.x = centerX + Math.cos(p.angle) * p.orbitRadius;
        p.y = centerY + Math.sin(p.angle) * p.orbitRadius;

        if(frame > 300) {
          p.phase = 'assemble';
        }
      } else if(p.phase === 'assemble') {
        p.x = lerp(p.x, p.targetX, 0.1);
        p.y = lerp(p.y, p.targetY, 0.1);

        if(Math.abs(p.x - p.targetX) < 1 && Math.abs(p.y - p.targetY) < 1) {
          p.x = p.targetX;
          p.y = p.targetY;
        } else {
          allAssembled = false;
        }
      }
      ctx.globalAlpha = p.opacity;
      ctx.fillText(p.char, p.x, p.y);
      ctx.globalAlpha = 1;
    }

    if(animationPhase === 'explode' && frame > 60) {
      animationPhase = 'orbit';
      frame = 0;
    } else if(animationPhase === 'orbit' && frame > 300) {
      animationPhase = 'assemble';
      frame = 0;
    } else if(animationPhase === 'assemble' && allAssembled) {
      animationPhase = 'done';
      // Оставляем частицы в сборе — не прячем canvas
    }

    if(animationPhase !== 'done') {
      requestAnimationFrame(animate);
    } else {
      // Если хочешь, тут можно продолжать рисовать, чтобы частицы не "замерзали"
      // или добавить какую-то лёгкую анимацию на месте.
      // Пока просто рисуем их статично.
      for(let p of particles) {
        ctx.fillText(p.char, p.x, p.y);
      }
    }
  }

  animate();

</script>
</body>
</html>
