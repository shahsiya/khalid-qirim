<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qirim Yurtu</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: linear-gradient(to bottom, #f8f9fa, #e9ecef);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    #icons {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      opacity: 0;
      transition: opacity 1s ease-in-out 0.5s;
    }

    #icons.visible {
      opacity: 1;
    }

    #icons img {
      margin: 0 10px;
      width: 40px;
      height: 40px;
      transition: transform 0.3s ease;
    }

    #icons img:hover {
      transform: scale(1.2);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="icons">
    <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub" />
    <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="HTML5" />
    <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn" />
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W, H;

    const lines = [
      "Добро пожаловать! / Hoş geldiniz! / Welcome!",
      "Я Khalid, также известен как Qirim Yurtu.",
      "Frontend-разработка, Firebase, WordPress, Tilda.",
      "Node.js, парсинг, автоматизация."
    ];

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
    }
    resize();
    window.addEventListener('resize', resize);

    const particleSize = 20;
    const particles = [];
    let frame = 0;
    let animationPhase = 'explode';

    const centerX = () => W / 2;
    const centerY = () => H / 2;

    const assembledPositions = [];
    function prepareAssembledPositions() {
      const totalHeight = lines.length * particleSize * 1.7;
      const startY = centerY() - totalHeight / 2;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const lineLength = line.length;
        const startX = centerX() - (lineLength * particleSize) / 2;
        for (let j = 0; j < lineLength; j++) {
          assembledPositions.push({
            x: startX + j * particleSize,
            y: startY + i * particleSize * 1.7,
            char: line[j]
          });
        }
      }
    }
    prepareAssembledPositions();

    function createParticles() {
      particles.length = 0;
      for (let i = 0; i < assembledPositions.length; i++) {
        const pos = assembledPositions[i];
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 2;
        particles.push({
          x: centerX(),
          y: centerY(),
          char: pos.char,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          targetX: pos.x,
          targetY: pos.y,
          phase: 'explode',
          flyRadius: 100 + Math.random() * 100,
          flyAngle: Math.random() * Math.PI * 2,
          flySpeed: 0.01 + Math.random() * 0.015,
          opacity: 0
        });
      }
    }
    createParticles();

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function animate() {
      ctx.clearRect(0, 0, W, H);
      ctx.font = `${particleSize}px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif`;
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';

      frame++;

      let allAssembled = true;

      for (let p of particles) {
        if (p.phase === 'explode') {
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.93;
          p.vy *= 0.93;
          p.opacity = Math.min(1, p.opacity + 0.03);
          if (Math.abs(p.vx) < 0.5 && Math.abs(p.vy) < 0.5) {
            p.phase = 'fly';
          }
        }

        if (p.phase === 'fly') {
          if (frame > 200) {
            p.flyRadius = lerp(p.flyRadius, 0, 0.04);
            if (p.flyRadius < 1) {
              p.x = lerp(p.x, p.targetX, 0.12);
              p.y = lerp(p.y, p.targetY, 0.12);
            } else {
              p.flyAngle += p.flySpeed;
              p.x = lerp(p.x, p.targetX + p.flyRadius * Math.cos(p.flyAngle), 0.08);
              p.y = lerp(p.y, p.targetY + p.flyRadius * Math.sin(p.flyAngle), 0.08);
            }
          } else {
            p.flyAngle += p.flySpeed;
            p.x += Math.cos(p.flyAngle) * 1.2;
            p.y += Math.sin(p.flyAngle) * 1.2;
          }

          if (Math.abs(p.x - p.targetX) > 1.5 || Math.abs(p.y - p.targetY) > 1.5 || p.flyRadius > 1) {
            allAssembled = false;
          }
        }

        ctx.globalAlpha = p.opacity;
        ctx.shadowColor = 'rgba(0,0,0,0.15)';
        ctx.shadowBlur = animationPhase === 'done' ? 6 : 3;
        ctx.fillStyle = '#222';
        ctx.fillText(p.char, p.x, p.y);
      }

      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;

      if (animationPhase !== 'done') {
        if (allAssembled && frame > 200) {
          animationPhase = 'done';
          document.getElementById('icons').classList.add('visible');
        } else {
          requestAnimationFrame(animate);
        }
      }
    }

    animate();
  </script>
</body>
</html>
