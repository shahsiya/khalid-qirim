<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qirim Yurtu</title>
  <style>
    /* Обнуляем стили и устанавливаем box-sizing */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffffff;
      color: #050505;
    }

    /* Контейнер с отступами */
    #container {
      max-width: 960px; /* например, фиксированная ширина */
      margin: 0 auto;
      padding: 0 20px; /* отступы справа и слева */
      height: 100vh;
      position: relative;
    }

    /* Адаптивный canvas - на всю ширину контейнера и всю высоту */
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Блок иконок */
    #icons {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 10px 16px;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 10;
      box-sizing: border-box;
    }

    /* Появление иконок после завершения анимации */
    #icons.visible {
      opacity: 1;
    }

    /* Иконки */
    #icons img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    #icons img:hover {
      transform: scale(1.1);
    }

    /* Медиазапросы */
    @media (max-width: 768px) {
      #icons img {
        width: 36px;
        height: 36px;
      }
    }

    @media (max-width: 480px) {
      #icons img {
        width: 32px;
        height: 32px;
      }
      #icons {
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="canvas"></canvas>

    <div id="icons">
      <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub" />
      <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="HTML5" />
      <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn" />
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('container');

    let W, H;
    let particleSize;
    let dpr = window.devicePixelRatio || 1;

    const lines = [
      "Добро пожаловать! / Hoş geldiniz! / Welcome!",
      "Я Khalid, также известен как Qirim Yurtu.",
      "Frontend-разработка, Firebase, WordPress, Tilda.",
      "Node.js, парсинг, автоматизация."
    ];

    let particles = [];
    let frame = 0;
    let animationPhase = 'explode';
    let assembledPositions = [];

    function centerX() { return W / 2; }
    function centerY() { return H / 2; }

    function getMaxFittingParticleSize() {
      const longestLine = lines.reduce((a, b) => (a.length > b.length ? a : b));
      const padding = 40;
      const availableWidth = W - padding;

      let size = 32;
      ctx.font = `bold ${size}px 'Poppins', sans-serif`;
      let textWidth = ctx.measureText(longestLine).width;

      while (textWidth > availableWidth && size > 10) {
        size -= 1;
        ctx.font = `bold ${size}px 'Poppins', sans-serif`;
        textWidth = ctx.measureText(longestLine).width;
      }

      return size;
    }

    function setupCanvas() {
      // размеры равны размерам контейнера
      W = container.clientWidth;
      H = container.clientHeight;

      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      ctx.imageSmoothingEnabled = false;

      particleSize = getMaxFittingParticleSize();

      prepareAssembledPositions();
      createParticles();
    }

    window.addEventListener('resize', () => {
      setupCanvas();
      // Если хочешь сбросить анимацию при ресайзе, можно добавить frame = 0 и animationPhase = 'explode' и createParticles();
    });

    function prepareAssembledPositions() {
      assembledPositions.length = 0;
      const totalHeight = lines.length * particleSize * 1.8;
      const startY = centerY() - totalHeight / 2;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const lineLength = line.length;
        const startX = centerX() - (lineLength * particleSize) / 2;
        for (let j = 0; j < lineLength; j++) {
          assembledPositions.push({
            x: startX + j * particleSize,
            y: startY + i * particleSize * 1.8,
            char: line[j]
          });
        }
      }
    }

    function createParticles() {
      particles.length = 0;
      for (let i = 0; i < assembledPositions.length; i++) {
        const pos = assembledPositions[i];
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 2;
        particles.push({
          x: centerX(),
          y: centerY(),
          char: pos.char,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          targetX: pos.x,
          targetY: pos.y,
          phase: 'explode',
          flyRadius: 100 + Math.random() * 100,
          flyAngle: Math.random() * Math.PI * 2,
          flySpeed: 0.01 + Math.random() * 0.015,
          opacity: 0
        });
      }
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function drawTextWithEffects(p, x, y) {
      ctx.shadowColor = 'rgba(0, 140, 255, 0.6)';
      ctx.shadowBlur = 8;
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(0, 100, 180, 0.8)';
      ctx.strokeText(p.char, x, y);

      const grad = ctx.createLinearGradient(x, y - particleSize / 2, x, y + particleSize / 2);
      grad.addColorStop(0, '#00c6ff');
      grad.addColorStop(1, '#0072ff');

      ctx.fillStyle = grad;
      ctx.shadowColor = 'rgba(0,0,0,0.1)';
      ctx.shadowBlur = 1;
      ctx.fillText(p.char, x, y);
    }

    function animate() {
      ctx.clearRect(0, 0, W, H);
      ctx.font = `bold ${particleSize}px 'Poppins', 'Segoe UI', Tahoma, Geneva, sans-serif`;
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';

      frame++;

      let allAssembled = true;

      for (let p of particles) {
        if (p.phase === 'explode') {
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.93;
          p.vy *= 0.93;
          p.opacity = Math.min(1, p.opacity + 0.03);
          if (Math.abs(p.vx) < 0.5 && Math.abs(p.vy) < 0.5) {
            p.phase = 'fly';
          }
        }

        if (p.phase === 'fly') {
          if (frame > 200) {
            p.flyRadius = lerp(p.flyRadius, 0, 0.04);
            if (p.flyRadius < 1) {
              p.x = lerp(p.x, p.targetX, 0.12);
              p.y = lerp(p.y, p.targetY, 0.12);
            } else {
              p.flyAngle += p.flySpeed;
              p.x = lerp(p.x, p.targetX + p.flyRadius * Math.cos(p.flyAngle), 0.08);
              p.y = lerp(p.y, p.targetY + p.flyRadius * Math.sin(p.flyAngle), 0.08);
            }
          } else {
            p.flyAngle += p.flySpeed;
            p.x += Math.cos(p.flyAngle) * 1.2;
            p.y += Math.sin(p.flyAngle) * 1.2;
          }

          if (Math.abs(p.x - p.targetX) > 1.5 || Math.abs(p.y - p.targetY) > 1.5 || p.flyRadius > 1) {
            allAssembled = false;
          }
        }

        ctx.globalAlpha = p.opacity;
        drawTextWithEffects(p, p.x, p.y);
      }

      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;

      if (animationPhase !== 'done') {
        if (allAssembled && frame > 200) {
          animationPhase = 'done';
          document.getElementById('icons').classList.add('visible');
        } else {
          requestAnimationFrame(animate);
        }
      }
    }

    setupCanvas();
    animate();
  </script>
</body>
</html>
