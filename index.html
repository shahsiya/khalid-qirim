<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Particles Text</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
      font-family: 'Poppins', sans-serif;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    let W = window.innerWidth;
    let H = window.innerHeight;

    const lines = [
      'Твори',
      'Созидай',
      'Вдохновляй'
    ];

    const fontName = 'Poppins, sans-serif';
    let particleSize = 28;
    const gap = 2;
    const particles = [];
    let assembledPositions = [];

    function getAdaptiveParticleSize(lines, maxWidth) {
      const ctxTest = document.createElement('canvas').getContext('2d');
      const baseSize = 32;

      for (let size = baseSize; size >= 14; size--) {
        ctxTest.font = `bold ${size}px ${fontName}`;
        const widestLine = lines.reduce((max, line) => {
          const width = ctxTest.measureText(line).width;
          return width > max ? width : max;
        }, 0);

        if (widestLine < maxWidth * 0.9) return size;
      }

      return 14;
    }

    function setupCanvas() {
      W = window.innerWidth;
      H = window.innerHeight;

      particleSize = getAdaptiveParticleSize(lines, W);

      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      ctx.imageSmoothingEnabled = false;

      prepareAssembledPositions();
      createParticles();
    }

    function prepareAssembledPositions() {
      assembledPositions = [];

      const offscreenCanvas = document.createElement('canvas');
      const offscreenCtx = offscreenCanvas.getContext('2d');

      offscreenCanvas.width = W;
      offscreenCanvas.height = H;

      offscreenCtx.clearRect(0, 0, W, H);
      offscreenCtx.fillStyle = '#fff';
      offscreenCtx.textAlign = 'center';
      offscreenCtx.textBaseline = 'middle';
      offscreenCtx.font = `bold ${particleSize}px ${fontName}`;

      const lineHeight = particleSize * 1.4;
      const totalHeight = lines.length * lineHeight;
      const startY = (H - totalHeight) / 2 + lineHeight / 2;

      lines.forEach((line, index) => {
        const y = startY + index * lineHeight;
        offscreenCtx.fillText(line, W / 2, y);
      });

      const imageData = offscreenCtx.getImageData(0, 0, W, H).data;

      for (let y = 0; y < H; y += gap) {
        for (let x = 0; x < W; x += gap) {
          const index = (y * W + x) * 4;
          const alpha = imageData[index + 3];

          if (alpha > 128) {
            assembledPositions.push({ x, y });
          }
        }
      }
    }

    function createParticles() {
      particles.length = 0;

      for (let i = 0; i < assembledPositions.length; i++) {
        const pos = assembledPositions[i];
        const angle = Math.random() * 2 * Math.PI;
        const radius = Math.random() * 300 + 100;

        const particle = {
          x: pos.x + Math.cos(angle) * radius,
          y: pos.y + Math.sin(angle) * radius,
          tx: pos.x,
          ty: pos.y,
          size: gap,
          color: `hsl(${Math.random() * 360}, 100%, 70%)`,
          vx: 0,
          vy: 0
        };

        particles.push(particle);
      }
    }

    function animate() {
      ctx.clearRect(0, 0, W, H);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        const dx = p.tx - p.x;
        const dy = p.ty - p.y;
        p.vx += dx * 0.01;
        p.vy += dy * 0.01;
        p.vx *= 0.92;
        p.vy *= 0.92;
        p.x += p.vx;
        p.y += p.vy;

        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      setupCanvas();
    });

    setupCanvas();
    animate();
  </script>
</body>
</html>
